[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purerl"
version = "0.2.0"
description = "Standalone TienKung locomotion environments for Isaac Sim"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium==1.3.0",
    "imageio[ffmpeg]>=2.37,<3",
    "numpy==1.26.0",
    "onnx>=1.16,<2",
    "PyYAML>=6.0,<7",
    "rsl-rl-lib==3.1.2",
    "tensordict==0.13.0",
    "tensorboard>=2.18,<3",
    "torch==2.7.0",
    "wandb>=0.19,<0.20",
]

[project.optional-dependencies]
sim = ["isaacsim[all,extscache]==5.1.0"]
dev = ["pytest>=8.0,<9", "ruff>=0.12,<0.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["purerl*"]

[tool.setuptools.package-data]
purerl = [
    "config/presets/*.yaml",
    "assets/robot_description/tienkung/*.urdf",
    "assets/robot_description/tienkung/meshes/*.STL",
]
